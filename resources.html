  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }

    body {
      background: #FAFAF8;
      color: #111110;

    }

    .page {
      width: min(92%, 640px);
      margin-inline: auto;
      padding-bottom: 4rem;
    }

    .journal-bar {
      border-bottom: 2px solid #111110;
      padding: 0.85rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 0.62rem;

    .back-link {
      color: #777770;
      text-decoration: none;

      transition: color 0.15s;
    }
    .back-link:hover { color: #111110; }

    #theme-toggle {
      background: #E8E8E4;
      border: none;
      cursor: pointer;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: #777770;
      padding: 3px 9px;
      border-radius: 2px;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #theme-toggle:hover { color: #111110; }

    .page-title {
      font-size: 1.7rem;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
      padding: 2rem 0 1.4rem;
    }

    .group { margin-bottom: 1.8rem; }

    .group-label {
      font-family: 'Source Code Pro', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #B83232;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid #DDDDD8;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #DDDDD8;
      text-decoration: none;
      color: #111110;
    }
    .row:hover .row-title { color: #B83232; }

    .row-title {
      font-size: 1.02rem;
      font-weight: 500;
      transition: color 0.15s;
    }

    .row-type {
      font-family: 'Source Code Pro', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #777770;
      white-space: nowrap;
    }

    html[data-theme="dark"] body { background: #0C0C0B; color: #E8E4DB; }
    html[data-theme="dark"] .journal-bar { border-bottom-color: #E8E4DB; }
    html[data-theme="dark"] .back-link { color: #7A7A72; }
    html[data-theme="dark"] .back-link:hover { color: #E8E4DB; }
    html[data-theme="dark"] #theme-toggle { background: #222220; color: #7A7A72; }
    html[data-theme="dark"] #theme-toggle:hover { color: #E8E4DB; }
    html[data-theme="dark"] .group-label { color: #C94040; border-bottom-color: #252522; }
    html[data-theme="dark"] .row { color: #E8E4DB; border-bottom-color: #252522; }
    html[data-theme="dark"] .row:hover .row-title { color: #C94040; }
    html[data-theme="dark"] .row-type { color: #7A7A72; }

    @media (max-width: 640px) {
      .journal-bar { flex-wrap: wrap; gap: 0.6rem; }
    }

<body>
<div class="page">

      <span id="toggle-icon">◐</span>
      <span id="toggle-label">Dark</span>
    </button>
  </div>

</div>

<script>
  (function () {
    var root = document.documentElement;
    var btn  = document.getElementById('theme-toggle');
    var icon = document.getElementById('toggle-icon');
    var lbl  = document.getElementById('toggle-label');
    function apply(t) {
      root.setAttribute('data-theme', t);
      try { localStorage.setItem('bb-theme', t); } catch (e) {}
      icon.textContent = t === 'dark' ? '◑' : '◐';
      lbl.textContent  = t === 'dark' ? 'Light' : 'Dark';
    }
    var saved = 'light';
    try { saved = localStorage.getItem('bb-theme') || 'light'; } catch (e) {}
    apply(saved);
    btn.addEventListener('click', function () {
      apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  })();
</script>
</body>
</html>
